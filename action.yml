name: A11yGate axe-core Regression Gate
description: Fail the job on new axe-core violations and publish an accessibility regression summary.
author: DaveEliranAssistant
branding:
  icon: check-square
  color: gray-dark

inputs:
  current:
    description: Paths to current axe-core JSON files, one path per line.
    required: true
  baseline:
    description: Paths to baseline axe-core JSON files, one path per line. Omit to treat every current finding as new.
    required: false
    default: ''
  manual-evidence:
    description: Optional path to manual accessibility evidence JSON.
    required: false
    default: ''
  threshold:
    description: Impact threshold. minor, moderate, serious, or critical.
    required: false
    default: serious
  markdown:
    description: File path for the Markdown summary. A temporary file is used when this is empty.
    required: false
    default: ''
  json:
    description: File path for the JSON result. A temporary file is used when this is empty.
    required: false
    default: ''
  summary:
    description: Append native Markdown to the job summary; disable when a final consolidated reporter owns it
    default: 'true'
  target-label:
    description: Application name for report titles; defaults to repository name or Application
    default: ''
  qe-result:
    description: Shared QE result file; defaults beside JSON output to qe-result-a11ygate.json
    default: ''
  update-baseline:
    description: When set, write the current results to this baseline path.
    required: false
    default: ''
  comment:
    description: Post or update a single pull request comment. true or false.
    required: false
    default: 'false'
  token:
    description: Job token used for same-repository pull request comments. Do not supply a PAT.
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: PASS, FAIL, or INCOMPLETE.
    value: ${{ steps.gate.outputs.verdict }}
  new:
    description: Count of new findings.
    value: ${{ steps.gate.outputs.new }}
  fixed:
    description: Count of fixed findings.
    value: ${{ steps.gate.outputs.fixed }}
  still-open:
    description: Count of still-open findings.
    value: ${{ steps.gate.outputs.still-open }}
  unassessed:
    description: Count of unassessed findings.
    value: ${{ steps.gate.outputs.unassessed }}
  coverage:
    description: Native coverage status.
    value: ${{ steps.gate.outputs.coverage }}
  coverage-issues:
    description: Count of coverage issues.
    value: ${{ steps.gate.outputs.coverage-issues }}
  unassessed-scope:
    description: Count of unassessed scope entries.
    value: ${{ steps.gate.outputs.unassessed-scope }}
  manual-checks:
    description: Count of manual checks.
    value: ${{ steps.gate.outputs.manual-checks }}
  comment-status:
    description: Comment delivery status (posted, skipped, skipped-fork, or error).
    value: ${{ steps.gate.outputs.comment-status }}
  exit-code:
    description: CLI exit code. 0 pass, 1 new violations, 2 incomplete coverage or invalid input.
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        A11Y_CURRENT: ${{ inputs.current }}
        A11Y_BASELINE: ${{ inputs.baseline }}
        A11Y_MANUAL_EVIDENCE: ${{ inputs.manual-evidence }}
        A11Y_THRESHOLD: ${{ inputs.threshold }}
        A11Y_MARKDOWN: ${{ inputs.markdown }}
        A11Y_JSON: ${{ inputs.json }}
        A11Y_QE_RESULT: ${{ inputs.qe-result }}
        A11Y_TARGET_LABEL: ${{ inputs.target-label }}
        A11Y_SUMMARY: ${{ inputs.summary }}
        A11Y_UPDATE_BASELINE: ${{ inputs.update-baseline }}
        A11Y_COMMENT: ${{ inputs.comment }}
        A11Y_TOKEN: ${{ inputs.token }}
        A11Y_PR_NUMBER: ${{ github.event.pull_request.number }}
        A11Y_REPOSITORY: ${{ github.repository }}
        A11Y_API_URL: ${{ github.api_url }}
      run: node "${{ github.action_path }}/run.mjs"
